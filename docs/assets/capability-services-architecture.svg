<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="792" viewBox="0 0 1440 792" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Capability Services package layers</title>
<desc id="desc">Three layers. Hosts (your application, conformance suite) use packages on the core: mcp, httpapi, tools, starlarkcap and jobs. Those use the core registry. starlarkcap alone imports script-services; mcp alone imports the MCP SDK and builds on tools.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFB547" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="792" rx="20" fill="#111A20"/>
<g font-family="'JetBrains Mono', Consolas, 'Liberation Mono', monospace">
<text x="40" y="53" font-size="28" fill="#FFB547" font-weight="700" text-anchor="start">&gt; CAPABILITY SERVICES</text>
<text x="40" y="87" font-size="22" fill="#E4ECE7" font-weight="400" text-anchor="start">Register once, project everywhere</text>
<text x="1400" y="53" font-size="18" fill="#E4ECE7" font-weight="400" text-anchor="end">PACKAGE LAYERS</text>
<path d="M40 111 H1400" stroke="#2A2F2C" stroke-width="2"/>
<text x="40" y="180" font-size="17" fill="#FFB547" font-weight="400" text-anchor="start">01 / HOSTS</text>
<text x="40" y="210" font-size="17" fill="#9DAAA3" font-weight="400" text-anchor="start">Wire it together</text>
<rect x="340" y="140" width="606" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M362 160 H396" stroke="#FFB547" stroke-width="3"/>
<text x="362" y="196" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">your application</text>
<text x="362" y="228" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">Views / auth / sessions</text>
<rect x="968" y="140" width="432" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M990 160 H1024" stroke="#FFB547" stroke-width="3"/>
<text x="990" y="196" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">conformance</text>
<text x="990" y="228" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">Same result everywhere</text>
<path d="M870 258 V300" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="884" y="286.0" font-size="16" fill="#FFB547" font-weight="400" text-anchor="start">imports</text>
<text x="40" y="348" font-size="17" fill="#FFB547" font-weight="400" text-anchor="start">02 / ON THE CORE</text>
<text x="40" y="378" font-size="17" fill="#9DAAA3" font-weight="400" text-anchor="start">Projections + jobs</text>
<rect x="340" y="308" width="185" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M362 328 H396" stroke="#FFB547" stroke-width="3"/>
<text x="362" y="364" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">mcp</text>
<text x="362" y="396" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">Agent tools</text>
<rect x="547" y="308" width="185" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M569 328 H603" stroke="#FFB547" stroke-width="3"/>
<text x="569" y="364" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">httpapi</text>
<text x="569" y="396" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">HTTP + OpenAPI</text>
<rect x="754" y="308" width="185" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M776 328 H810" stroke="#FFB547" stroke-width="3"/>
<text x="776" y="364" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">tools</text>
<text x="776" y="396" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">LLM tool loops</text>
<rect x="961" y="308" width="231" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M983 328 H1017" stroke="#FFB547" stroke-width="3"/>
<text x="983" y="364" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">starlarkcap</text>
<text x="983" y="396" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">Starlark scripts</text>
<rect x="1215" y="308" width="185" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M1237 328 H1271" stroke="#FFB547" stroke-width="3"/>
<text x="1237" y="364" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">jobs</text>
<text x="1237" y="396" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">jobs.* tools</text>
<path d="M870 426 V468" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="884" y="454.0" font-size="16" fill="#FFB547" font-weight="400" text-anchor="start">imports</text>
<text x="40" y="516" font-size="17" fill="#FFB547" font-weight="400" text-anchor="start">03 / CORE</text>
<text x="40" y="546" font-size="17" fill="#9DAAA3" font-weight="400" text-anchor="start">No internal imports</text>
<rect x="340" y="476" width="1060" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M362 496 H396" stroke="#FFB547" stroke-width="3"/>
<text x="362" y="532" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">registry</text>
<text x="362" y="564" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">Capabilities / views / versions / job table / errors</text>
<path d="M340 604 H1400" stroke="#2A2F2C" stroke-width="2" stroke-dasharray="4 6"/>
<text x="40" y="648" font-size="17" fill="#FFB547" font-weight="400" text-anchor="start">EXTERNAL</text>
<text x="40" y="676" font-size="17" fill="#9DAAA3" font-weight="400" text-anchor="start">Go modules</text>
<text x="340" y="648" font-size="18" fill="#E4ECE7" font-weight="400" text-anchor="start">craggy-io/script-services</text>
<text x="810" y="648" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">starlarkcap only</text>
<text x="340" y="676" font-size="18" fill="#E4ECE7" font-weight="400" text-anchor="start">modelcontextprotocol/go-sdk</text>
<text x="810" y="676" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">mcp only (mcp also builds on tools)</text>
<text x="340" y="704" font-size="18" fill="#E4ECE7" font-weight="400" text-anchor="start">google/jsonschema-go</text>
<text x="810" y="704" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">registry, jobs, tools</text>
<text x="40" y="762" font-size="17" fill="#9DAAA3" font-weight="400" text-anchor="start">Each layer imports only layers below it (mcp also builds on tools). examples/host is a sample application.</text>
</g></svg>
